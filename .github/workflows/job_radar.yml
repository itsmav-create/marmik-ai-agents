name: Executive Job Opportunity Radar

on:
  # Daily at 7:00 Sydney (AEDT ≈ 20:00 UTC previous day) – tweak if you want a different time
  schedule:
    - cron: "0 20 * * *"
  # Manual trigger from Actions tab
  workflow_dispatch: {}

jobs:
  job-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Radar
        env:
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          JOB_FROM_EMAIL:   ${{ secrets.JOB_FROM_EMAIL }}
          JOB_TO_EMAIL:     ${{ secrets.JOB_TO_EMAIL }}
          TARGET_LOCATIONS: ${{ secrets.TARGET_LOCATIONS }}
          TARGET_TITLES:    ${{ secrets.TARGET_TITLES }}
        run: python job_radar.py
